[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doppelganger-thai-voice"
version = "0.1.0"
description = "ด็อปเปิลเก็งเงอร์ — local Thai voice cloning"
requires-python = ">=3.10,<3.13"
dependencies = [
  # av 19 dropped open(metadata_errors=...), which faster-whisper 1.2.1 still passes.
  "av==15.1.0",
  "faster-whisper==1.2.1",
  "fastapi==0.162.2",
  "gradio==6.31.0",
  # CUDA 12 runtime for ctranslate2 (Whisper on GPU). The Whisper worker never
  # imports torch, so it cannot use the copies bundled inside torch's wheel.
  "nvidia-cublas-cu12==12.9.2.10",
  "nvidia-cudnn-cu12==9.28.1.4",
  "python-multipart==0.0.32",
  "soundfile==0.14.0",
  "torch==2.14.1",
  "torchaudio==2.11.0",
  "transformers==5.22.2",
  "uvicorn==0.53.0",
  "voxcpm==2.0.3",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[project.scripts]
thai-voice-clone = "thai_voice_clone.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
